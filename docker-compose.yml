
services:
  mongodb:
    image: mongo:latest
    container_name: visitor-management-db
    ports:
      - '27018:27017'
    volumes:
      - mongodb_data:/data/db
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visitor-management-app
    ports:
      - '3000:3000'
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/visitor-management
      - SMS_API_KEY=${SMS_API_KEY}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - mongodb
    restart: always

volumes:
  mongodb_data:
